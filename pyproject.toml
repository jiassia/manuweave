[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "manuweave"
version = "0.2.1"
description = "Native academic document formatting tools for agent skills"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["python-docx>=1.1", "lxml>=5", "pydantic>=2.7,<3", "pylatexenc>=2.10", "pypdfium2>=4", "Pillow>=10"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]
word = ["pywin32>=306; sys_platform == 'win32'"]
convert = ["pypandoc_binary>=1.15"]

[project.scripts]
manuweave = "manuweave.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/manuweave"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
